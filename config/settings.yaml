exchanges:
  ib:
    port: 4002
    client_id: 1
    account_id: "DUO892946"
  binance:
    testnet: true
  okx:
    testnet: true
  coinbase:
    testnet: true
  kraken:
    testnet: true
  kucoin:
    testnet: false
  deriv:
    # Deriv uses WebSocket API, no testnet flag needed for production
    # For testing, you would use a different app_id or endpoint

data:
  sources:
    - name: "yfinance"
      enabled: true
  update_frequency:
    historical: "1d"
    intraday: "5m"

risk_management:
  max_capital_per_trade: 0.02
  max_portfolio_heat: 0.15
  daily_loss_limit: 0.05
  max_drawdown: 0.20
  volatility_stop_multiplier: 2.0
  max_net_exposure: 0.5
  max_gross_exposure: 2.5
  max_position_pct: 0.25
  per_symbol_multipliers:
    QBTS: 4.0
    OPTT: 4.5
  # EOD reporting and time-based caps (times in UTC)
  eod_report_utc_time: "19:55"   # 15:55 ET during daylight saving
  overnight_cap_utc_time: "19:50" # 15:50 ET during daylight saving
  weekend_flatten_utc_time: "19:50" # same time on Friday
  overnight_cap_threshold: 0.20   # reduce positions >20% NAV to 20%
  weekend_flatten_threshold: 0.25 # reduce positions >25% NAV to 15%
  weekend_flatten_target: 0.15

  risk_by_broker:
  kucoin:
    max_gross_exposure: 3.0        # 300%
    max_position_pct: 0.20         # 20% per coin
    max_net_exposure: 0.8          # 80%
    max_drawdown: 0.25             # 25% drawdown halt
    daily_loss_limit: 0.05         # 5% daily loss
    volatility_stop_multiplier: 1.5

